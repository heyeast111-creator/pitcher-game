<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투수키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 야간 경기장. 위에 선수 HUD, 가운데 무대(경기장 장면 또는 훈련 카드), 아래 조작부. 주인공은 포수 시점의 스트라이크존. */
:root{
  color-scheme:dark;
  --night:#091425; --panel:#12233b; --panel2:#0c1a2e; --line:#28425f;
  --chalk:#f4f1e6; --dim:#9fb3c8;
  --lamp:#ffc93c; --grass:#44c776; --seam:#ff5a45; --team:#4b6b8a;
  --display:"Do Hyeon","Gothic A1",sans-serif; --impact:"Black Han Sans","Do Hyeon",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.5}
body{padding:14px 16px 40px;background:radial-gradient(60% 40% at 10% 0%,#1c3558 0%,transparent 70%),radial-gradient(60% 40% at 90% 0%,#1c3558 0%,transparent 70%),var(--night);background-attachment:fixed}
#app{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-family:var(--impact);font-size:clamp(2.8rem,10vw,4.6rem);line-height:.95}
h2{font-size:1.5rem}
h3{font-size:1.05rem;color:var(--dim)}
p{margin:0}
.dim{color:var(--dim)} .small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 #050c18}
.gbtn{font-family:var(--display);font-size:1.15rem;background:var(--lamp);color:#221a00;border:0;border-bottom:4px solid #b98a12;border-radius:10px;padding:10px 20px}
.gbtn:active{transform:translateY(2px);border-bottom-width:2px}
.gbtn:disabled{opacity:.4;cursor:not-allowed}
.gbtn.sub{background:#1d3352;color:var(--chalk);border-bottom-color:#0a1526}
.gbtn.red{background:var(--seam);color:#fff;border-bottom-color:#a52d1f}
.gbtn.big{font-size:1.5rem;padding:14px 28px;width:100%}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;padding:6px}
/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border-top:5px solid var(--team)}
.emb{width:58px;height:58px;border-radius:50%;background:var(--team);display:grid;place-items:center;font-family:var(--impact);font-size:1.7rem;color:#fff;border:3px solid var(--chalk);box-shadow:0 3px 0 #050c18}
.hud .nm{font-family:var(--display);font-size:1.5rem;line-height:1.1;overflow-wrap:anywhere}
.ovr{text-align:center;background:var(--night);border:2px solid var(--line);border-radius:10px;padding:4px 12px}
.ovr b{display:block;font-family:var(--impact);font-size:2rem;line-height:1;color:var(--lamp)}
.pips{display:flex;gap:5px;align-items:center}
.pips i{width:22px;height:8px;border-radius:4px;background:#22364f}
.pips i.on{background:var(--grass)} .pips i.now{background:var(--lamp)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:4.6em 1fr 3.2em;gap:8px;align-items:center;font-size:.92rem}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:14px;border-radius:3px;background:#1d3049}
.segs.ok i.f{background:var(--grass)} .segs.warn i.f{background:var(--lamp)} .segs.bad i.f{background:var(--seam)}
.fill{height:12px;border-radius:6px;background:#1d3049;overflow:hidden}
.fill u{display:block;height:100%;border-radius:6px;background:var(--chalk);transition:width .5s}
.fill.fat u{background:linear-gradient(90deg,var(--grass),var(--lamp) 60%,var(--seam))}
.fill.trust u{background:#6aa7ff} .fill.fans u{background:#ff8fb0}
.grade{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:5px;font-family:var(--impact);background:#1d3049}
.grade.S{background:var(--lamp);color:#221a00}.grade.A{background:var(--seam);color:#fff}.grade.B{background:#6aa7ff;color:#04142e}.grade.C{background:var(--grass);color:#062412}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.88rem}
.chip strong{font-family:var(--display);font-size:1.05rem;font-weight:400}
.chip.up{border-color:var(--grass);color:var(--grass)} .chip.down{border-color:var(--seam);color:var(--seam)}
@media(prefers-reduced-motion:no-preference){.chip.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}.burst{animation:burst 1.5s ease-out both}.ballw.new{animation:fly .42s cubic-bezier(.3,0,.7,1) both}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
/* 훈련 카드 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--night);border:2px solid var(--line);border-bottom-width:5px;border-radius:12px;padding:12px;min-height:128px}
.tc:hover:not(:disabled){border-color:var(--lamp);transform:translateY(-2px)}
.tc:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.tc:disabled{opacity:.4;cursor:not-allowed}
.tc svg{width:30px;height:30px;stroke:var(--lamp);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tc strong{font-family:var(--display);font-size:1.2rem;font-weight:400}
.tc small{color:var(--dim);font-size:.8rem;line-height:1.35}
.tc em{font-style:normal;font-size:.78rem;margin-top:auto;color:var(--chalk)}
.tc.on{border-color:var(--lamp);background:#1b2c12}
.toggle{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{background:transparent;border:0;padding:7px 16px;font-family:var(--display);font-size:1.05rem}
.toggle button.on{background:var(--chalk);color:var(--night)}
.toggle button.on.hard{background:var(--seam);color:#fff}
.note{border-left:5px solid var(--lamp);padding:8px 12px;background:var(--night);border-radius:0 8px 8px 0}
.note.bad{border-color:var(--seam)} .note.good{border-color:var(--grass)}
input[type=text]{font:inherit;background:var(--night);color:var(--chalk);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;max-width:280px}
/* 경기 */
.sb{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;background:#050c18;border-radius:10px;padding:6px;font-family:var(--display)}
.sb>div{background:#0f1f36;border-radius:6px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.sb span{font-size:.72rem;color:var(--dim);font-family:var(--body)}
.sb b{font-weight:400;font-size:1.3rem;color:var(--lamp);line-height:1}
.lamps{display:flex;gap:5px;align-items:center}
.lamps i{width:14px;height:14px;border-radius:50%;background:#22364f}
.lamps.b i.on{background:var(--grass);box-shadow:0 0 8px var(--grass)}.lamps.s i.on{background:var(--lamp);box-shadow:0 0 8px var(--lamp)}.lamps.o i.on{background:var(--seam);box-shadow:0 0 8px var(--seam)}
.dia{position:relative;width:44px;height:44px}
.dia i{position:absolute;width:15px;height:15px;background:#22364f;transform:rotate(45deg)}
.dia i.on{background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.dia i:nth-child(1){right:2px;top:15px}.dia i:nth-child(2){left:15px;top:2px}.dia i:nth-child(3){left:2px;top:15px}
.play{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:14px;align-items:start}
@media(max-width:760px){.play{grid-template-columns:1fr}}
.scene{position:relative;aspect-ratio:10/9;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#0b1a30}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.zone{position:absolute;left:27%;width:46%;top:34%;height:58%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr)}
.cell{position:relative;background:transparent;border:1px dashed rgba(244,241,230,.16);padding:0;border-radius:0}
.cell.k{border:1.5px solid rgba(244,241,230,.85);background:rgba(244,241,230,.07)}
.cell:hover:not(:disabled){background:rgba(255,201,60,.35)}
.cell.sel{background:rgba(255,201,60,.75)}
.cell.aim::after{content:"";position:absolute;inset:22%;border:2px dotted var(--lamp);border-radius:50%}
.ballw{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2}
.ball{width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9d4c4);border:2px solid var(--seam);display:grid;place-items:center;color:#111;font-weight:800;font-size:.75rem;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.ballw.old .ball{opacity:.4;border-color:transparent;width:50%}
@keyframes fly{0%{transform:translate(var(--sx),var(--sy)) scale(.12)}55%{transform:translate(var(--mx),var(--my)) scale(.5)}100%{transform:none}}
.burst{position:absolute;left:0;right:0;top:8%;text-align:center;font-family:var(--impact);font-size:clamp(2rem,9vw,3.4rem);color:var(--lamp);text-shadow:0 4px 0 #050c18,0 0 18px rgba(0,0,0,.8);pointer-events:none;z-index:3}
.burst.bad{color:var(--seam)} .burst.good{color:var(--grass)}
@keyframes burst{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.15);opacity:1}40%{transform:scale(1)}100%{opacity:.9}}
.pits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pit{background:var(--night);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column}
.pit strong{font-family:var(--display);font-weight:400;font-size:1.1rem;overflow-wrap:anywhere}
.pit small{color:var(--dim);font-size:.78rem}
.pit.on{border-color:var(--lamp);background:#2a2208}
.mbar{position:relative;height:34px;border-radius:8px;background:#1d3049;overflow:hidden;border:2px solid var(--line)}
.mbar .sw{position:absolute;top:0;bottom:0;background:rgba(68,199,118,.55)}
.mbar .pf{position:absolute;top:0;bottom:0;background:var(--lamp)}
.mbar .mk{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2.5px;background:#fff;box-shadow:0 0 8px #fff}
.log{font-size:.88rem;display:flex;flex-direction:column;gap:3px;max-height:9.5em;overflow:auto}
.log div{color:var(--dim)} .log div:first-child{color:var(--chalk);font-weight:600}
.hero{position:relative;aspect-ratio:16/8;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero div{position:absolute;left:5%;bottom:8%;right:5%;text-shadow:0 4px 0 #050c18,0 0 24px rgba(0,0,0,.9)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:400;font-size:.78rem}
td.n,th.n{text-align:right}
tr.me td{color:var(--lamp);font-weight:800}
tr.sum td{font-family:var(--display);font-size:1.3rem;color:var(--lamp);border-bottom:0}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--dim)}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- 유틸 ---------- */
const R=Math.random, ri=(a,b)=>Math.floor(R()*(b-a+1))+a, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(R()*a.length)], gauss=()=>(R()+R()+R()-1.5)*1.4;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>(Math.round(n*10)/10).toFixed(1), sg=n=>(n>0?'+':'')+f1(n);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

let AC=null;
function snd(k){ if(SET.mute) return; try{ AC=AC||new (globalThis.AudioContext||globalThis.webkitAudioContext)();
  const seq={strike:[[660,.07],[880,.12]],ball:[[220,.12]],foul:[[400,.06]],hit:[[150,.05,'square'],[95,.14,'square']],k:[[660,.07],[880,.07],[1320,.18]],hr:[[300,.14],[220,.14],[150,.3]],out:[[520,.08],[390,.12]],ui:[[520,.035]],gain:[[700,.06],[1050,.1]],bad:[[200,.1],[150,.18]]}[k]||[];
  let t=AC.currentTime; for(const [f,d,ty] of seq){ const o=AC.createOscillator(), g=AC.createGain(); o.type=ty||'triangle'; o.frequency.value=f; g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d); t+=d; } }catch(e){} }

/* ---------- 데이터 ---------- */
const TIER={hs:{n:'고교',diff:30,mult:.4,turns:['봄 대회','주말 리그','여름 대회','가을 대회']},
 col:{n:'대학',diff:37,mult:.45,turns:['춘계 리그','하계 리그','대통령기','추계 리그']},
 fut:{n:'2군',diff:44,mult:.6,turns:['4월','6월','8월','10월']},

const ROLES=[{id:'sp',n:'선발',d:'처음 능력치가 높고 성장이 느리다. 이닝이 많아 팔이 빨리 닳는다',init:5,grow:.85},{id:'mr',n:'중계',d:'능력치와 성장이 모두 평균. 홀드를 쌓는다',init:1,grow:1},{id:'cl',n:'마무리',d:'처음 능력치가 낮고 성장이 빠르다. 9회를 맡아 세이브를 쌓는다',init:-3,grow:1.18}];
const RN={sp:'선발',mr:'중계',cl:'마무리'};
const STARTP={fire:['sld','frk','cut'],craft:['crv','chg','sld'],iron:['two','chg','crv']};
const SCHOOLS=['한강고','무등고','영도고','달구벌고','한밭고','미추홀고'];
const KBO=[{n:'서울 곰',i:'곰',c:'#27408f',tag:'2군 훈련 효과가 15% 높다',grow:1.15},
 {n:'서울 쌍둥이',i:'쌍',c:'#b0123b',tag:'팬 인기가 빨리 오른다',fan:1.3},
 {n:'서울 영웅',i:'영',c:'#7a1f3d',tag:'젊은 투수를 1군에 일찍 올린다',promo:1},
 {n:'인천 상륙단',i:'상',c:'#c8102e',tag:'강팀이라 승리가 잘 붙는다',str:.04},
 {n:'수원 마법사',i:'마',c:'#3a3a44',tag:'변화구 숙련이 20% 빨리 오른다',mas:1.2},
 {n:'대전 독수리',i:'독',c:'#e8651a',tag:'약팀이라 승은 적지만 신뢰를 얻기 쉽다',str:-.06,tr:1.4},
 {n:'대구 사자',i:'사',c:'#1556b8',tag:'명문 구단. 타이틀 점수가 30% 높다',title:1.3},
 {n:'광주 호랑이',i:'호',c:'#d0202a',tag:'우승 후보. 승리가 잘 붙지만 신뢰는 짜다',str:.05,tr:.8},
 {n:'부산 갈매기',i:'갈',c:'#0f2f66',tag:'열성 팬. 인기가 크게 오르내린다',fan:1.5,fanDown:1.5},
 {n:'창원 공룡',i:'공',c:'#1c4a7a',tag:'관리 야구. 휴식 효과가 30% 높다',rest:1.3}];

 {id:'craft',n:'기교파',d:'제구와 변화가 좋고 공이 느리다',m:{velo:-8,ctl:9,brk:6}},
 {id:'iron',n:'고무팔',d:'체력이 좋고 팔이 튼튼하다',m:{sta:10},arm:12}];

 {id:'ctl',n:'제구 훈련',d:'코너만 노려 던진다. 릴리스 구간이 넓어진다',sh:.5,el:.5,fat:12},
 {id:'brk',n:'변화구 연마',d:'변화 능력과 변화구 숙련도. 팔꿈치를 쓴다',sh:.3,el:1.0,fat:13},
 {id:'sta',n:'체력 훈련',d:'러닝과 하체. 이닝이 늘고 피로가 덜 쌓인다',sh:0,el:0,fat:8},
 {id:'men',n:'멘탈 훈련',d:'타자를 더 정확히 읽고 릴리스가 느려진다',sh:0,el:0,fat:2},
 {id:'rest',n:'휴식과 관리',d:'피로를 크게 풀고 팔을 조금 회복한다',rest:1},
 {id:'lab',n:'구종 연구소',d:'새 구종을 만들거나, 숙련도 80을 넘긴 구종을 상위 구종으로 진화시킨다',lab:1}];

function doTrain(id,hard){
  const t=TR.find(x=>x.id===id), tm=team(), msg=[], gains=[]; U.injured=false; U.lastTrain=id;
  if(t.rest){ fatg(-45*(tm.rest||1)); wear(-1.5,-1.5); msg.push('푹 쉬었다. 피로가 풀리고 팔이 조금 회복됐다.'); gains.push(['피로','크게 회복',1]); }
  else{
    const mul=hard?1.8:1, wm=(hard?2.4:1)*(1+G.fat/120)*ageWear();
    let g=(3+R()*2)*(1-G.stats[id]/115)*mul*(G.league==='fut'?(tm.grow||1):1)*(G.grow||1)*(G.league==='col'?1.15:1);
    if(R()<.1){ g*=2; msg.push('몸이 유난히 가볍다. 훈련 효과가 두 배로 들어왔다.'); }
    if(id==='velo'&&G.age>31) g*=.4;
    st(id,g); gains.push([SN[id],'+'+f1(g),1]);
    if(id==='brk'&&G.pitches.length>1){ const m=7*mul*(tm.mas||1); G.pitches.filter(p=>!p.fb).forEach(p=>p.mas=clamp(p.mas+m,0,100)); gains.push(['변화구 숙련','+'+f1(m),1]); }
    if(id==='velo'||id==='ctl'){ G.pitches[0].mas=clamp(G.pitches[0].mas+4*mul,0,100); }
    fatg(t.fat*(hard?2:1)); wear(t.sh*wm,t.el*wm);
    if(t.sh) gains.push(['어깨','-'+f1(t.sh*wm),0]); if(t.el) gains.push(['팔꿈치','-'+f1(t.el*wm),0]);
    const risk=Math.max(0,G.fat-60)*.012+(hard?.1:0);
    if(t.sh+t.el>0 && R()<risk){ const j=R()<.5?'sh':'el', d=ri(6,12); G.arm[j]=clamp(G.arm[j]-d,0,G.arm.max); G.fat=30; U.injured=true;
      msg.push(`훈련 중 ${j==='sh'?'어깨':'팔꿈치'}에 통증이 왔다. 이번 일정은 결장한다.`); gains.push([j==='sh'?'어깨':'팔꿈치','-'+d,0]); }
  }
  U.trainMsg=msg; U.gains=gains;
  const ev=TEV.filter(e=>e.on.includes(id)&&(!e.c||e.c()));
  if(!U.injured&&ev.length&&R()<.55){ U.tev={e:pickEv(ev,'seenT')}; G.phase='trainEv'; } else G.phase='ready';
  save();
}

function makePitch(){

function newAB(){
  const d=tier().diff, kind=pick(['교타자','장타자','선구안이 좋은 타자']);
  const b={name:G.league==='big'?pick(FOR):pick(SUR)+pick(GIV),kind,side:R()<.65?'R':'L',contact:d+ri(-8,10)+(kind==='교타자'?10:0),eye:d+ri(-10,10)+(kind[0]==='선'?20:0),power:d+ri(-10,10)+(kind==='장타자'?20:0),sit:R()<.5?'fast':'slow'};
  const acc=.6+G.stats.men/250, read=R()<acc?b.sit:(b.sit==='fast'?'slow':'fast');
  return {b,read,conf:acc>.82?'높음':acc>.7?'보통':'낮음',balls:0,strikes:0,hist:[]};
}
function startGame(mode){
  if(mode==='auto') return simPeriod(null);
  const sp=isSP(), late=G.role==='cl'?[9]:[ri(6,8)]; let segs;
  if(mode==='inning') segs=[{inn:sp?pick([1,3,5]):late[0],o:0,b:[0,0,0],lead:'선두 타자부터 직접 던진다.'}];
  else{ const n=sp?2:1, inns=sp?[ri(2,4),ri(5,7)]:late;
    segs=inns.slice(0,n).map(inn=>{const c=pick(CRISIS);return {inn,o:c.o,b:c.b.slice(),lead:pick(['한 점 차 리드','동점','두 점 차 리드'])+'. 포수가 마운드로 올라왔다.'}}); }
  U.g={mode,segs,si:-1,runs:0,ks:0,outsGot:0,log:[],sel:0,cell:null}; nextSeg(); G.phase='game'; save();
}
function nextSeg(){ const g=U.g; g.si++; if(g.si>=g.segs.length) return finishGame();
  const s=g.segs[g.si]; g.inn=s.inn; g.outs=s.o; g.bases=s.b.slice(); g.segRuns=0; g.ab=newAB(); g.phase='pick'; g.cell=null; g.last=null; g.burst=null;
  g.log.unshift(`${s.inn}회 ${['무사','1사','2사'][s.o]} ${baseTxt(s.b)}. ${s.lead}`); }
const baseTxt=b=>{const n=['1','2','3'].filter((x,i)=>b[i]); return n.length===3?'만루':n.length?n.join('·')+'루':'주자 없음'};
const sweetW=p=>clamp(22+G.stats.ctl*.16+p.mas*.05+p.ctl*.3,16,44);
const period=()=>clamp(1700-G.fat*5+G.stats.men*3-(U.g.ab.strikes===2?100:0),900,2200);
const now=()=>globalThis.performance?performance.now():Date.now();
const meterPos=()=>{const t=((now()-U.g.mt0)/period())%1; return t<.5?t*200:(1-t)*200};
function release(){ const g=U.g, p=G.pitches[g.sel], d=Math.abs((g.mshown??meterPos())-50), w=sweetW(p); g.mshown=null;
  if(d<=w/6) resolvePitch(.2,'완벽한 릴리스'); else if(d<=w/2) resolvePitch(.6,'좋은 릴리스'); else resolvePitch(1.1+d/60,'릴리스가 흔들렸다'); }
function resolvePitch(f,q){
  const g=U.g, d=g.ab, p=G.pitches[g.sel], b=d.b, [tr,tc]=g.cell, n=d.hist.length;
  const sig=clamp(1-G.stats.ctl/120+G.fat/300,.3,1.1)*f;
  const r=clamp(tr+Math.round(gauss()*sig),0,4), c=clamp(tc+Math.round(gauss()*sig),0,4);
  const inZ=r>=1&&r<=3&&c>=1&&c<=3, center=r===2&&c===2, cat=p.dv>-9?'fast':'slow', sf=stuff(p);
  let seq=0; const pv=d.hist[n-1], pv2=d.hist[n-2];
  if(pv){ const df=Math.abs(pv.dv-p.dv); seq+=df>=20?.12:df>=12?.08:0; if(pv.idx===g.sel){seq-=.06; if(pv2&&pv2.idx===g.sel) seq-=.08;} if(Math.abs(pv.r-r)>=2) seq+=.05; }
  const match=b.sit===cat; let txt, out=null, burst, tone='', sfx;
  let pSwing;
  if(inZ) pSwing=.72+(d.strikes===2?.22:0)-(!match&&d.strikes<2?.14:0);
  else pSwing=clamp(.2+(sf-50)/250+seq*.5+(d.strikes===2?.12:0)-b.eye/300+(p.ax==='v'&&!p.fb&&r===4?.1:0)+(p.fb&&r===0?.06:0),.05,.7);
  if(R()<pSwing){
    const whiff=clamp(.18+(sf-b.contact)/160+seq+(inZ?0:.25)-(match?.15:0)+(center?-.1:.04),.03,.85);
    if(R()<whiff){ d.strikes++; burst='헛스윙!'; tone='good'; sfx='strike'; txt=match?'노리던 공인데도 못 맞혔다.':'타이밍을 완전히 뺏었다.'; }
    else if(R()<(inZ?.38:.5)){ if(d.strikes<2) d.strikes++; burst='파울'; sfx='foul'; txt=match?'타이밍이 맞아 나갔다.':'방망이가 늦었다.'; }
    else{
      const hitP=clamp(.3+(b.contact-sf)/250+(match?.18:0)+(center?.15:0)-(inZ?0:.15)-seq*.5,.08,.75);
      if(R()<hitP){ const hr=clamp(b.power/260+(center?.15:0)+(match?.1:0),.03,.6);
        if(R()<hr){ out='HR'; burst='홈런…'; sfx='hr'; txt='맞는 순간 넘어갔다.'; } else if(R()<.28){ out='XBH'; burst='2루타'; sfx='hit'; txt='좌중간을 갈랐다.'; } else { out='1B'; burst='안타'; sfx='hit'; txt='내야를 빠져나갔다.'; }
        tone='bad'; }
      else { out='out'; burst='아웃!'; tone='good'; sfx='out'; txt='빗맞았다.'; }
    }
  } else if(inZ){ d.strikes++; burst='스트라이크!'; tone='good'; sfx='strike'; txt=match?'지켜봤다.':'노리던 공이 아니라 그냥 보냈다.'; }
  else { d.balls++; burst='볼'; sfx='ball'; txt='속지 않았다.'; }
  if(!out){ if(d.strikes>=3){ out='K'; burst='삼진!'; tone='good'; sfx='k'; } else if(d.balls>=4){ out='bb'; burst='볼넷'; tone='bad'; sfx='bad'; } }
  d.hist.push({idx:g.sel,dv:p.dv,r,c,tr,tc}); g.last={r,c,tr,tc,ax:p.ax,fb:p.fb};
  g.log.unshift(`${p.name} ${kmh(p)}km/h, ${q}. ${burst.replace(/[!…]/g,'')}. ${txt}`);
  wear(p.ss*.09*ageWear(),p.se*.09*ageWear()); fatg(.8); p.mas=clamp(p.mas+1,0,100);
  const l2=d.hist.slice(-2);
  if(!out&&l2.length===2){ const cs=l2.map(h=>h.dv>-9?'fast':'slow'); if(cs[0]===cs[1]&&b.sit!==cs[0]&&R()<.6) b.sit=cs[0]; }
  g.cell=null; g.burst={t:burst,tone}; snd(sfx);
  if(out) applyOut(out); else g.phase='pick';
  save();
}
function applyOut(out){
  const g=U.g, b=g.bases; let runs=0, extra='';
  if(out==='K'){ g.outs++; g.ks++; g.outsGot++; }
  else if(out==='out'){
    if(R()<.55&&b[0]&&g.outs<2&&R()<.45){ g.outs+=2; g.outsGot+=2; b[0]=0; extra='병살타!'; g.burst={t:'병살!',tone:'good'}; }
    else if(b[2]&&g.outs<2&&R()<.4){ g.outs++; g.outsGot++; b[2]=0; runs=1; extra='희생플라이로 한 점을 내줬다.'; }
    else { g.outs++; g.outsGot++; }
  }
  else if(out==='bb'){ if(b[0]&&b[1]&&b[2]) runs=1; else if(b[0]&&b[1]) b[2]=1; else if(b[0]) b[1]=1; b[0]=1; if(runs) extra='밀어내기 실점.'; }
  else if(out==='1B'){ runs+=b[2]; b[2]=0; if(b[1]){ if(R()<.6) runs++; else b[2]=1; b[1]=0; } if(b[0]){ b[1]=1; } b[0]=1; }
  else if(out==='XBH'){ runs+=b[2]+b[1]; b[2]=0; b[1]=0; if(b[0]){ if(R()<.4) runs++; else b[2]=1; b[0]=0; } b[1]=1; }
  else if(out==='HR'){ runs=1+b[0]+b[1]+b[2]; g.bases=[0,0,0]; }
  g.runs+=runs; g.segRuns+=runs;
  if(runs&&out!=='out'&&out!=='bb') extra=`${runs}점을 내줬다.`;
  if(extra) g.log.unshift(extra);
  if(g.outs>=3){ g.phase='segEnd'; g.endTxt=g.segRuns?`이닝 종료. 이 이닝에 ${g.segRuns}점을 내줬다.`:'이닝 종료. 무실점으로 막았다.'; }
  else if(g.segRuns>=4){ g.phase='segEnd'; g.endTxt='감독이 공을 받으러 올라왔다. 강판.'; }
  else g.phase='abEnd';
}
function finishGame(){ const g=U.g; if(g.tryout) return tryoutEnd(g); const adj=clamp(g.runs*.5-.45-g.ks*.12,-1.1,2); simPeriod(adj,g); }

function tryoutEnd(g){ const t=G.flags.try, pass=g.runs<=1; U.g=null; G.flags.try=null; fatg(-10);
  let res; if(pass){ joinTeam(t.to,50,'fut'); res=`${g.runs}실점으로 막았다. 합격. ${KBO[t.to].n} 2군에서 프로 생활을 시작한다.`; }

function simPeriod(adj,g){
  const L=tier(), tm=team(), s=G.stats, best=Math.max(...G.pitches.map(stuff)), lines=[], chips=[];
  let e=clamp(4.6-(rating()-L.diff)*.09+(adj||0)+(G.fat>70?.5:0)+(R()-.5),.8,9.9);
  const sp=isSP(), cl=!sp&&G.role==='cl', games=G.league==='hs'?4:G.league==='col'?5:sp?7:cl?13:14;
  const ip=Math.round(sp?games*clamp(3.5+s.sta/22,4,8):games*(cl?1:1.1)), er=Math.round(e*ip/9), k=Math.round(ip*(5+best/14)/9);
  e=er*9/ip;
  const wp=clamp(.5+(4.3-e)*.1+(tm.str||0),.12,.88); let w=0,l=0; const dec=sp?Math.round(games*.7):ri(1,3);
  for(let i=0;i<dec;i++) R()<wp?w++:l++;
  const sv=cl?Math.round(games*.75*wp):0, hd=(!sp&&!cl)?Math.round(games*.45*wp):0;
  let bonus=sv*4+hd*2.5, t0=G.trust, f0=G.fans; if(cl) fans(1);
  if(g){ G.career.dt++; const clean=g.runs===0; if(clean) G.career.dw++; bonus+=(clean?12:0)+g.ks*4+g.outsGot*2;
    fans(clean?3+g.ks:g.ks*.5-Math.min(g.runs,3)*.7); trust(clean?2:-1);
    lines.push(`직접 던진 구간: 아웃 ${g.outsGot}개, 삼진 ${g.ks}개, ${g.runs}실점`); }
  const sc=Math.max(0,Math.round((ip*2+k-er*3+w*6+bonus)*L.mult));
  for(const o of [G.season,G.career]){o.w+=w;o.l+=l;o.ip+=ip;o.er+=er;o.k+=k;o.sv=(o.sv||0)+sv;o.hd=(o.hd||0)+hd}
  G.career.score+=sc;
  trust(clamp((4.2-e)*1.5,-5,5)); fans(clamp((4.3-e)*1.0-.4,-3,3));
  const wm=(1+G.fat/120)*ageWear(), base=sp?1.2:cl?.7:.8; wear(base*wm,base*wm);
  fatg((sp?12:cl?8:9)*(1.2-s.sta/200)-10);
  lines.unshift(`${club()} · ${L.turns[G.turn]}: ${games}경기 ${ip}이닝 ${w}승 ${l}패${sv?` ${sv}세이브`:''}${hd?` ${hd}홀드`:''}, 자책 ${er}, 탈삼진 ${k} (평균자책 ${f1(e)})`);
  chips.push(['구단 신뢰',G.trust-t0],['팬 인기',G.fans-f0]);
  U.report={lines,chips}; U.g=null; G.phase='report'; save();
}

function ageOffer(){ const f=G.flags, a=G.age;
  if(f.mil!==2){ if(a>=28){ f.mil=2; return EV_MILF; } if(a>=22&&!f.mil){ f.mil=1; return EV_MIL; } }
  if(a>=30&&!f.e30){ f.e30=1; return EV_30; }
  if(a>=35&&!f.e35){ f.e35=1; return EV_TOUR; }
  if(a>=36&&!f.e36&&G.trust>=50&&!f.tour){ f.e36=1; return EV_COACH; }
  return null; }
function draftInfo(){ const r=rating(), rd=r>=50?1:r>=44?2:r>=38?4:8; let a=ri(0,9),b,c; do{b=ri(0,9)}while(b===a); do{c=ri(0,9)}while(c===a||c===b);

function endSeason(){
  const s=G.season, e=era(s), tm=team(), msg=[], from=G.league, r=rating(); let offer=null;
  G.hist.push({y:G.year,age:G.age,lg:club(),w:s.w,l:s.l,ip:s.ip,era:e,k:s.k});
  if(!amateur(from)){ G.trustSum+=G.trust*.8; G.teamYears++; }
  if(G.flags.tour===1) G.flags.tour=2;
  if(from==='pro'||from==='big'){ G.proYears++;
    if(s.ip>=60&&e<=2.6){ G.titles+=(tm.title||1); fans(10); trust(6); msg.push('평균자책 1위 타이틀을 차지했다.'); }
    if(s.k>=190){ G.titles+=(tm.title||1); fans(8); msg.push('탈삼진왕에 올랐다.'); }
    if((s.sv||0)>=30){ G.titles+=(tm.title||1); fans(8); msg.push('세이브왕에 올랐다.'); } }
  if(from==='hs'){ G.flags.draft=draftInfo(); offer='draft'; }
  else if(from==='col'){ G.flags.colN=(G.flags.colN||0)+1; G.age++; if(G.flags.colN>=2){ G.flags.draft=draftInfo(); offer='draft'; } else msg.push('대학 2학년을 마쳤다. 2년 뒤 다시 드래프트에 나선다.'); }
  else if(from==='fut'){ if(!s.ip) msg.push('한 시즌을 통째로 비웠다.'); else if(e<=(tm.promo?4.3:3.9)||r>=(tm.promo?47:50)){ G.league='pro'; G.futYears=0; msg.push('1군에 승격했다.'); } else { G.futYears++; msg.push(`1군의 부름을 받지 못했다. 2군 ${G.futYears}년째.`); } }

    if(e>=6.3){ if(G.trust>=70){ trust(-15); msg.push('성적은 나빴지만 감독이 한 번 더 믿어 주기로 했다. 구단 신뢰가 크게 깎였다.'); } else { G.league='fut'; msg.push('부진 끝에 2군으로 내려갔다.'); } }
    else if(G.trust<20){ let t; do{t=ri(0,KBO.length-1)}while(t===G.team); G.team=t; G.oneClub=false; G.trust=45; G.teamYears=0; msg.push(`구단과 사이가 틀어져 ${KBO[t].n}로 트레이드됐다.`); }
    else if(G.fans>=45&&e<=3.5&&!G.flags.big){ G.flags.big=1; offer=EV_BIG; }
    else if(G.proYears>=8&&!G.flags.fa){ G.flags.fa=1; offer=EV_FA; } }
  else if(from==='big'&&s.ip>0&&e>=6.5){ G.league='pro'; G.trust=50; msg.push(`빅리그에서 방출돼 ${KBO[G.team].n}로 돌아왔다.`); }
  G.age++; G.year++; G.turn=0; G.season={w:0,l:0,ip:0,er:0,k:0}; fatg(-40); G.flags.role=0;
  if(G.age>=32){ const d=1+(G.age-32)*.4; st('velo',-d); st('sta',-1); msg.push(`나이가 든다. 구속 -${f1(d)}, 체력 -1`); }
  if(!offer&&!amateur()&&G.flags.tour!==2) offer=ageOffer();
  U.seasonMsg={msg,e,s,from:G.hist[G.hist.length-1].lg,offer}; G.phase='season'; save();
}
function afterSeason(){
  if(G.flags.tour===2) return retire('은퇴 투어를 마치고 박수 속에 마운드를 내려왔다.');
  if(G.futYears>=5) return retire('2군에서 다섯 시즌을 보낸 끝에 방출 통보를 받았다.');
  if(G.age>=41) return retire('마흔을 넘겨 스스로 유니폼을 벗었다.');
  const m=U.seasonMsg; U.seasonMsg=null;
  if(m&&m.offer){ U.ev={e:m.offer==='draft'?draftEvent():m.offer,next:'train'}; G.phase='event'; save(); return; }
  G.phase='train'; U.hard=false; save();
}
function retire(why){
  const sig=G.pitches.filter(p=>!p.fb).sort((a,b)=>b.mas-a.mas)[0], c=G.career;

  if(G.oneClub&&G.proYears>=8) rows.push(['원클럽맨',300]);
  if(G.flags.coach) rows.push(['지도자',200]); if(G.flags.tour===2) rows.push(['은퇴 투어',150]);
  const num=!amateur()&&G.trust>=75&&G.fans>=65&&G.teamYears>=9; if(num) rows.push(['영구결번',500]);
  G.final={why,rows,score:rows.reduce((a,b)=>a+b[1],0),sig:sig?`${sig.name}(${sig.grip})`:'직구',num,club:team().n}; G.phase='retire'; save();
}

  if(G.flags.try){ joinTeam(G.flags.try.back,38,'fut'); G.flags.try=null; G.phase='train'; }
  if(G.flags.draft&&G.phase!=='retire'){ U.ev={e:draftEvent(),next:'train'}; G.phase='event'; }
}
function act(a,b){
  const v=b.v, keep=id=>{const el=document.getElementById(id); return el?el.value:''};
  switch(a){
    case 'hand': U.pn=keep('pn'); U.hand=v; break;
    case 'type': U.pn=keep('pn'); U.type=v; break;
    case 'role': U.pn=keep('pn'); U.role=v; break;
    case 'spit': U.pn=keep('pn'); U.spit=v; break;
    case 'new': { const ty=U.type||'fire'; newGame(keep('pn').trim().slice(0,8),U.hand||'우완',ty,U.role||'sp',STARTP[ty].includes(U.spit)?U.spit:STARTP[ty][0]); break; }
    case 'cont': U.home=false; recover(); break;
    case 'home': U.home=true; break;
    case 'mute': SET.mute=!SET.mute; store.set('acearm.set',SET); break;
    case 'again': G=null; store.del('acearm.save4'); U={}; break;
    case 'rank': U.rank=true; loadRank(); break;
    case 'rankx': U.rank=false; break;
    case 'hard': U.hard=v==='1'; break;
    case 'train': U.askquit=false; if(v==='lab'){ U.lab={grip:'sld',slot:'tq',spin:'safe'}; } else { doTrain(v,U.hard&&v!=='rest'); snd(U.injured?'bad':'gain'); } break;
    case 'lab': U.pnm=keep('pname'); U.lab[b.k]=v; break;
    case 'labx': U.lab=null; U.pnm=''; break;
    case 'evo': evolve(+b.i,+b.j); U.lab=null; snd('gain'); break;
    case 'mk': makePitch(); U.lab=null; U.pnm=''; snd('gain'); break;
    case 'tev': U.tev.res=U.tev.e.ch[+v][1](); save(); break;
    case 'tevnext': U.trainMsg.push(U.tev.res); U.tev=null; G.phase='ready'; if(checkRetire()) break; save(); break;
    case 'rehab': G.out--; G.fat=0; G.turn++; if(G.turn>=4) endSeason(); else save(); break;
    case 'askquit': U.askquit=true; break;
    case 'noquit': U.askquit=false; break;
    case 'quit': U.askquit=false; retire('스스로 마운드를 내려왔다.'); break;
    case 'mode': startGame(v); break;
    case 'skip': skipPeriod(); break;
    case 'pit': U.g.sel=+v; break;
    case 'cell': U.g.cell=[+b.r,+b.c]; U.g.last=null; U.g.burst=null; break;
    case 'throw': if(U.g.cell){ U.g.phase='meter'; U.g.mt0=now(); U.g.mshown=null; } break;
    case 'rel': if(U.g.phase==='meter') release(); break;
    case 'nextab': U.g.ab=newAB(); U.g.phase='pick'; U.g.last=null; U.g.burst=null; break;
    case 'nextseg': nextSeg(); break;
    case 'next': afterReport(); break;
    case 'ev': U.ev.res=U.ev.e.ch[+v][1](); save(); break;
    case 'evnext': { const n=U.ev.next; U.ev=null; if(checkRetire()) break; if(n==='tryout'){ G.league='fut'; G.team=G.flags.try.to; startGame('inning'); U.g.tryout=1; U.g.log.unshift('입단 테스트. 1점 이하로 막으면 합격이다.'); } else if(n==='turn') nextTurn(); else { G.phase='train'; save(); } break; }
    case 'season': afterSeason(); break;
    case 'reg': registerRank(); break;
    case 'regon': registerOnline(); break;
  }
  if(!['rel','train','mk','evo'].includes(a)) snd('ui');
  render();
  if(U.pn){ const el=document.getElementById('pn'); if(el) el.value=U.pn; }
  if(U.pnm){ const el=document.getElementById('pname'); if(el) el.value=U.pnm; }
}
$.addEventListener('pointerdown',ev=>{ const b=ev.target.closest('[data-a=rel]'); if(b&&U.g&&U.g.phase==='meter'){ ev.preventDefault(); act('rel',{}); } });
$.addEventListener('click',ev=>{ const b=ev.target.closest('[data-a]'); if(!b||b.disabled) return; act(b.dataset.a,b.dataset); });
document.addEventListener('keydown',ev=>{ if(ev.code==='Space'&&G&&G.phase==='game'&&U.g&&!U.rank&&!U.home){ if(U.g.phase==='meter'){ ev.preventDefault(); act('rel',{}); } } });
U.home=true; render();
</script>
</body>
